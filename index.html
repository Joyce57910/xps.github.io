<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮宿命恋人画像测试</title>
    <style>
        :root {
            --primary-color: #9B59B6; /* 浪漫紫 */
            --accent-color: #E056FD; /* 亮粉紫 */
            --bg-color: #F3E5F5;
            --card-bg: #FFFFFF;
            --text-color: #4A235A;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(155, 89, 182, 0.15);
            overflow: hidden;
            padding-bottom: 30px;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #c471ed 0%, #f64f59 100%);
            padding: 40px 20px;
            text-align: center;
            color: #fff;
            position: relative;
        }
        
        /* 装饰性星星 */
        .header::after {
            content: '✨';
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 24px;
            opacity: 0.8;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            margin-top: 10px;
            opacity: 0.95;
            font-size: 14px;
            font-weight: 300;
        }

        .content {
            padding: 25px;
        }

        .question-block {
            display: none;
        }
        
        .question-block.active {
            display: block;
            animation: fadeIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .question-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #2c3e50;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid #E1BEE7;
            border-radius: 15px;
            background: #fff;
            text-align: left;
            font-size: 15px;
            color: #555;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .option-btn:active {
            background-color: #F3E5F5;
            border-color: var(--primary-color);
            transform: scale(0.98);
        }

        .progress-bar {
            height: 6px;
            background: #F0F0F0;
            margin-bottom: 25px;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #c471ed, #f64f59);
            width: 0%;
            transition: width 0.4s ease;
        }

        .pay-wall {
            display: none;
            text-align: center;
            padding: 40px 15px;
        }

        .pay-icon {
            font-size: 50px;
            margin-bottom: 10px;
            display: block;
        }

        .pay-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .pay-price {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary-color);
            margin: 15px 0;
            font-family: 'Arial', sans-serif;
        }

        .pay-btn {
            background: linear-gradient(135deg, #c471ed 0%, #f64f59 100%);
            color: white;
            border: none;
            padding: 16px 50px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(246, 79, 89, 0.3);
            width: 100%;
            transition: transform 0.2s;
        }
        
        .pay-btn:active {
            transform: scale(0.95);
        }

        .result-page {
            display: none;
            text-align: center;
            padding: 10px;
            animation: fadeIn 0.8s;
        }

        .result-header {
            font-size: 14px;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .result-title {
            font-size: 26px;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .result-card {
            background: #FFF;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        
        .result-label {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
            display: block;
            font-size: 14px;
        }

        .result-text {
            font-size: 15px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔮 宿命恋人画像</h1>
        <p>测测TA会带着什么剧本闯入你的生活？</p>
    </div>

    <div class="content">
        <div class="progress-bar" id="progressBar" style="display:none;">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- 题目区域 -->
        <div id="quizContainer">
            <!-- JS生成题目 -->
        </div>

        <!-- 支付墙 -->
        <div id="payWall" class="pay-wall">
            <span class="pay-icon">💌</span>
            <div class="pay-title">分析已完成</div>
            <p style="color:#666; font-size:14px;">查收属于你的恋爱剧本</p>
            <div class="pay-price">¥ 1.99</div>
            <button class="pay-btn" onclick="simulatePayment()">解锁完整画像 🔓</button>
            <p style="margin-top:15px; font-size:12px; color:#999;">已有 23,402 人获取了她们的剧本</p>
        </div>

        <!-- 结果页 -->
        <div id="resultPage" class="result-page">
            <div class="result-header">YOUR DESTINY</div>
            <h2 class="result-title" id="resTitle"></h2>
            
            <div class="result-card">
                <span class="result-label">👤 他的画像</span>
                <div class="result-text" id="resDesc"></div>
            </div>
            
            <div class="result-card">
                <span class="result-label">🎬 宿命剧本</span>
                <div class="result-text" id="resScript"></div>
            </div>
            
            <button class="option-btn" style="text-align:center; background:#f0f0f0; border:none;" onclick="location.reload()">再测一次 ↻</button>
        </div>
    </div>
</div>

<script>
    // 题目配置
    const questions = [
        {
            title: "Q1. 周末午后外面下着暴雨，你一个人在家最想做的是？",
            options: [
                { text: "A. 窝在沙发看老电影，手里捧着热可可", type: "A" },
                { text: "B. 听着雨声整理房间，做顿精致料理", type: "B" },
                { text: "C. 给朋友打视频电话，吐槽最近趣事", type: "C" },
                { text: "D. 打开电脑处理工作，或者看书充电", type: "D" }
            ]
        },
        {
            title: "Q2. 手机没电在陌生城市迷路，你的第一反应？",
            options: [
                { text: "A. 有点慌，寻找看起来面善的路人求助", type: "A" },
                { text: "B. 进便利店借充电宝或看地图", type: "B" },
                { text: "C. 直接拦出租车，先离开这再说", type: "D" },
                { text: "D. 觉得有点刺激，干脆四处逛逛", type: "C" }
            ]
        },
        {
            title: "Q3. 闭上眼想象，你理想中的婚礼在哪里？",
            options: [
                { text: "A. 私密海岛，只有至亲，海风吹起白纱", type: "A" },
                { text: "B. 传统隆重的酒店，接受长辈祝福", type: "B" },
                { text: "C. 疯狂的草地派对，大家嗨到天亮", type: "C" },
                { text: "D. 不一定要婚礼，旅行结婚就好", type: "D" }
            ]
        },
        {
            title: "Q4. 你希望他忙碌一天回家后，对你说的第一句话？",
            options: [
                { text: "A. “见到你我就充满了电。”", type: "A" },
                { text: "B. “买了你爱吃的蛋糕，在冰箱里。”", type: "B" },
                { text: "C. “快来！今天有个大瓜要跟你讲！”", type: "C" },
                { text: "D. “今天辛苦了，以后这种累活交给我。”", type: "D" }
            ]
        },
        {
            title: "Q5. 你的理想恋爱像哪部电影？",
            options: [
                { text: "A. 《爱在黎明破晓前》- 灵魂碰撞", type: "A" },
                { text: "B. 《请回答1988》- 温暖陪伴", type: "B" },
                { text: "C. 《疯狂动物城》- 冒险搭档", type: "C" },
                { text: "D. 《史密斯夫妇》- 强强联手", type: "D" }
            ]
        },
        {
            title: "Q6. 你最不能接受伴侣的一点是？",
            options: [
                { text: "A. 没有共情能力，冷漠", type: "A" },
                { text: "B. 不顾家，总是玩消失", type: "B" },
                { text: "C. 无趣死板，开不起玩笑", type: "C" },
                { text: "D. 没有上进心，得过且过", type: "D" }
            ]
        }
    ];

    // 结果配置
    const results = {
        "A": {
            title: "🌌 星河摆渡人 (灵魂伴侣型)",
            desc: "眼神深邃，手指修长，可能从事艺术、文学或科研工作。他不善言辞，但内心世界极其丰富。",
            script: "你们的相遇像是一场久别重逢。可能是在书店、画展或者某个安静的角落。他能听懂你所有未说出口的话，他爱的不是你的皮囊，而是你破碎又迷人的灵魂。"
        },
        "B": {
            title: "🔥 暖冬守夜人 (爹系宠溺型)",
            desc: "肩膀宽厚，笑起来很温暖，衣着干净整洁。职业稳定（医生、教师、公务员）。",
            script: "他比你稍微年长，或者心理年龄很成熟。在你最疲惫、最狼狈的时候，他会替你挡住所有风雨。他对你的爱藏在每一顿热饭和每一个吹干头发的细节里。"
        },
        "C": {
            title: "🪁 夏日追风者 (少年玩伴型)",
            desc: "充满活力，有虎牙或酒窝，运动型。可能是创业者、自由职业或体育相关。",
            script: "你们是吵吵闹闹的欢喜冤家。他会带你去跳伞、去深潜、去看不一样的世界。和他在一起，你永远不会老，每天都是新鲜的冒险。他是你的恋人，也是你最好的玩伴。"
        },
        "D": {
            title: "♟️ 暗夜执棋者 (霸总/势均力敌型)",
            desc: "气场强大，西装革履，行事果断。企业高管或精英律师。",
            script: "你们是“王见王”的相遇。起初可能互看不顺眼，或者在职场上交锋。但他欣赏你的独立和野心。他不需要你做依附的小鸟，他要你做与他并肩作战的王后。"
        }
    };

    let currentStep = 0;
    let scores = { A: 0, B: 0, C: 0, D: 0 };

    function initQuiz() {
        const container = document.getElementById('quizContainer');
        const progressBar = document.getElementById('progressBar');
        
        progressBar.style.display = 'block';

        questions.forEach((q, index) => {
            const div = document.createElement('div');
            div.className = 'question-block';
            div.id = `q-${index}`;
            
            let html = `<div class="question-title">${q.title}</div>`;
            q.options.forEach(opt => {
                html += `<button class="option-btn" onclick="handleOption('${opt.type}', ${index})">${opt.text}</button>`;
            });
            
            div.innerHTML = html;
            container.appendChild(div);
        });

        document.getElementById('q-0').classList.add('active');
        updateProgress();
    }

    function handleOption(type, index) {
        scores[type]++;
        
        // 隐藏当前题
        document.getElementById(`q-${index}`).classList.remove('active');

        if (index < questions.length - 1) {
            // 显示下一题
            currentStep++;
            document.getElementById(`q-${currentStep}`).classList.add('active');
            updateProgress();
        } else {
            // 题目做完，显示支付墙
            document.getElementById('progressBar').style.display = 'none';
            document.getElementById('payWall').style.display = 'block';
        }
    }

    function updateProgress() {
        const percent = ((currentStep + 1) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${percent}%`;
    }

    function simulatePayment() {
        // 这里对接真实的支付逻辑
        // 模拟支付成功，计算结果
        const maxType = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        showResult(maxType);
    }

    function showResult(type) {
        document.getElementById('payWall').style.display = 'none';
        const resPage = document.getElementById('resultPage');
        const data = results[type];
        
        document.getElementById('resTitle').innerText = data.title;
        document.getElementById('resDesc').innerText = data.desc;
        document.getElementById('resScript').innerText = data.script;
        
        resPage.style.display = 'block';
    }

    // 初始化
    initQuiz();

</script>

</body>
</html>
